name: Deploy dashboard

# Builds the Evidence dashboard (reports/) and publishes it to GitHub Pages.
# Reads the committed CSV exports of the dbt marts, so it needs no Snowflake access
# and keeps working after the trial expires.
on:
  push:
    branches: [main]
    paths:
      - "reports/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set base path for GitHub Pages
        working-directory: reports
        # Project Pages serve under /<repo>/, so the site needs that base path.
        # Done here (not in the committed config) so local `npm run dev` stays at /.
        run: |
          printf '\ndeployment:\n  basePath: /dbt-snowflake-pipeline\n' >> evidence.config.yaml

      - name: Install and build
        working-directory: reports
        run: |
          npm ci
          npm run sources
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
