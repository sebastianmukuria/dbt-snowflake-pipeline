version: 2

models:
  - name: fct_orders
    description: "One row per order line, enriched with customer + product + revenue. The table Sigma connects to."
    columns:
      - name: order_line_id
        description: "Grain of the table: one row per order line."
        data_tests: [unique, not_null]
      - name: order_id
        data_tests: [not_null]      # not unique: an order can have several lines
      - name: revenue
        description: "quantity * unit_price for the line."
        data_tests: [not_null]

  - name: daily_sales
    description: "Revenue and order counts rolled up per day."
    columns:
      - name: order_date
        data_tests: [unique, not_null]

  - name: dim_customers
    description: "One row per customer with attributes + lifetime spend/orders and favorite category."
    columns:
      - name: customer_id
        description: "Primary key - one row per customer."
        data_tests: [unique, not_null]
      - name: favorite_category
        data_tests:
          - accepted_values:
              arguments:
                values: ['coffee', 'tea', 'pastry']
